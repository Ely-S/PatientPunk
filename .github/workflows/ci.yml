name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.8.11"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -v --cov --cov-report=term-missing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Lint reproducible study update
        run: >-
          uv run ruff check
          studies/tropoflavin_nootropics/episode_dose_audit.py
          studies/tropoflavin_nootropics/severity_model_data.py
          studies/tropoflavin_nootropics/severity_model_contracts.py
          studies/tropoflavin_nootropics/severity_models.py
          studies/tropoflavin_nootropics/severity_report_data.py
          studies/tropoflavin_nootropics/severity_report_figures.py
          studies/tropoflavin_nootropics/publish_severity_reports.py
          tests/test_tropoflavin_episode_dose_audit.py
          tests/test_severity_models.py
          tests/test_severity_publication.py

      - name: Type-check reproducible study update
        run: uv run mypy
