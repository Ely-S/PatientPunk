[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "patientpunk"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "pydantic>=2.0",
    # pandas removed: Windows Application Control blocks DLLs on this machine.
    # db.py uses stdlib csv instead. Marimo apps can use pandas if needed.
    "python-dotenv>=1.0",
    "marimo>=0.9",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patientpunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "UP",   # pyupgrade (modern Python idioms)
    "B",    # flake8-bugbear
    "A",    # flake8-builtins (shadowing builtins)
    "I",    # isort
    "N",    # pep8-naming
    "RUF",  # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["patientpunk"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
