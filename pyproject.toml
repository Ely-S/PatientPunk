[project]
name = "patientpunk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.18.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scipy>=1.12",
    "pandas>=2.1",
    "statsmodels>=0.14",
    "lifelines>=0.29",
    "pydantic>=2.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
]
cluster = [
    "scikit-learn>=1.3",   # cluster-prep readiness report (silhouette); matrix builder works without it
    "numpy>=1.24",
]
openai = [
    "openai>=1.0",         # LLM_PROVIDER=openai: talk to vLLM / Ollama / any OpenAI-compatible endpoint
]

[tool.pytest.ini_options]
testpaths = ["variable_extraction/tests", "tests"]
pythonpath = ["src"]
