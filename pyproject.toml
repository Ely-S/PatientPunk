[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patientpunk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.18.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.2",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "rich>=13.7",
    # `regex` supports a real, interruptible match timeout -- unlike stdlib `re`,
    # which cannot be aborted mid-match. Discovery runs LLM-generated patterns that
    # can catastrophically backtrack; see discover._finditer_with_timeout.
    "regex>=2024.4",
    "scipy>=1.14",
    "seaborn>=0.13",
    "statsmodels>=0.14",
    "typer>=0.12",
    "openai>=2.45.0",
]

# Runtime extras -- installable with pip: `pip install '.[cluster,openai]'`
# or `pip install 'patientpunk[cluster]'`.
[project.optional-dependencies]
cluster = [
    "scikit-learn>=1.3",   # cluster-prep readiness report (silhouette); matrix builder works without it
    "numpy>=1.24",
]
openai = [
    "openai>=1.0",         # LLM_PROVIDER=openai: talk to vLLM / Ollama / any OpenAI-compatible endpoint
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ruff>=0.12",
    "mypy>=1.15",
    "pre-commit>=4.0",
]
ui = [
    "streamlit>=1.30",
    "plotly>=5.18",
]

# The importable package (patientpunk) lives under variable_extraction/.
[tool.setuptools]
package-dir = {"" = "variable_extraction"}

[tool.setuptools.packages.find]
where = ["variable_extraction"]
include = ["patientpunk*"]

[tool.pytest.ini_options]
testpaths = ["variable_extraction/tests", "tests"]
pythonpath = ["src"]

# Scope new quality gates to the reproducible study update. Legacy pipeline
# modules retain their existing tests and can adopt these gates separately.
[tool.mypy]
explicit_package_bases = true
files = [
    "studies/tropoflavin_nootropics/episode_dose_audit.py",
    "studies/tropoflavin_nootropics/severity_model_data.py",
    "studies/tropoflavin_nootropics/severity_model_contracts.py",
    "studies/tropoflavin_nootropics/severity_models.py",
    "studies/tropoflavin_nootropics/severity_report_data.py",
    "studies/tropoflavin_nootropics/severity_report_figures.py",
    "studies/tropoflavin_nootropics/publish_severity_reports.py",
]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true

[tool.coverage.run]
source = [
    "studies.tropoflavin_nootropics.episode_dose_audit",
    "studies.tropoflavin_nootropics.severity_model_data",
    "studies.tropoflavin_nootropics.severity_model_contracts",
    "studies.tropoflavin_nootropics.severity_models",
    "studies.tropoflavin_nootropics.severity_report_data",
    "studies.tropoflavin_nootropics.severity_report_figures",
    "studies.tropoflavin_nootropics.publish_severity_reports",
]

[tool.coverage.report]
fail_under = 75
show_missing = true

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "C4", "SIM"]
