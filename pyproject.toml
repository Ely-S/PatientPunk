[project]
name = "patientpunk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.18.0",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    # Dispersed integration: vLLM endpoints are OpenAI-compatible.
    "openai>=1.0",
    # Dispersed REST client uses httpx directly (it's already a transitive
    # dep of anthropic, but we pin it as a direct dep too).
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "Scrapers/demographic_extraction/tests"]
pythonpath = ["src"]
