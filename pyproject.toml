[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "patientpunk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.18.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scipy>=1.12",
    "pandas>=2.1",
    "pydantic>=2.5",
]

# Runtime extras -- installable with pip: `pip install '.[cluster,openai]'`
# or `pip install 'patientpunk[cluster]'`.
[project.optional-dependencies]
cluster = [
    "scikit-learn>=1.3",   # cluster-prep readiness report (silhouette); matrix builder works without it
    "numpy>=1.24",
]
openai = [
    "openai>=1.0",         # LLM_PROVIDER=openai: talk to vLLM / Ollama / any OpenAI-compatible endpoint
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# The importable package (patientpunk) lives under variable_extraction/.
[tool.setuptools]
package-dir = {"" = "variable_extraction"}

[tool.setuptools.packages.find]
where = ["variable_extraction"]
include = ["patientpunk*"]

[tool.pytest.ini_options]
testpaths = ["variable_extraction/tests"]
pythonpath = ["src"]
