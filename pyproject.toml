[project]
name = "patientpunk"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.18.0",
    "ipykernel>=6.29",
    "matplotlib>=3.9",
    "nbconvert>=7.16",
    "nbformat>=5.10",
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.0",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "scipy>=1.14",
    "seaborn>=0.13",
    "statsmodels>=0.14",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "Scrapers/demographic_extraction/tests"]
pythonpath = ["src"]
